<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>go-ex — архитектура торговой площадки ЦФА</title>
  <style>
    :root {
      --bg: #0f1216;
      --bg-2: #161b22;
      --bg-3: #1c2330;
      --line: #2b3340;
      --text: #e7ecf2;
      --muted: #8b95a4;
      --accent: #6ea8fe;
      --ok: #3dd68c;
      --warn: #e3b341;
      --bad: #f87171;
      --eth: #627eea;
      --fab: #2f6f4e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif; }
    button, select { font: inherit; color: inherit; }
    a { color: var(--accent); }
    .app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
    header {
      display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
      padding: 16px 20px 12px; border-bottom: 1px solid var(--line); background: var(--bg-2);
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .02em; }
    header p { margin: 4px 0 0; color: var(--muted); max-width: 78ch; }
    .tabs { display: flex; gap: 0; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
    .tabs button {
      background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
      padding: 10px 14px; cursor: pointer;
    }
    .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
    .stage { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
    .stage.wide { grid-template-columns: 1fr; }
    .stage.wide .side { display: none; }
    .main { overflow: auto; padding: 16px 20px 28px; }
    .side {
      border-left: 1px solid var(--line); background: var(--bg-2); overflow: auto; padding: 16px 16px 28px;
    }
    .layer { margin-bottom: 14px; }
    .layer h3 {
      margin: 0 0 8px; font-size: 11px; font-weight: 650; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em;
    }
    .nodes { display: flex; flex-wrap: wrap; gap: 8px; }
    .node {
      background: var(--bg-3); border: 1px solid var(--line); border-radius: 6px;
      padding: 8px 10px; min-width: 132px; cursor: pointer; user-select: none;
    }
    .node:hover { border-color: #4b5568; }
    .node.on { border-color: var(--accent); background: #1a2740; }
    .node.hl { border-color: var(--ok); background: #14261c; }
    .node.dim { opacity: .28; }
    .node .k { font-size: 11px; color: var(--muted); }
    .node .n { font-weight: 650; }
    .node[data-kind="chain"] { border-left: 3px solid var(--eth); }
    .node[data-kind="fabric"] { border-left: 3px solid var(--fab); }
    .node[data-kind="hot"] { border-left: 3px solid var(--warn); }
    .node[data-kind="data"] { border-left: 3px solid #8b95a4; }
    .legend { display: flex; gap: 14px; color: var(--muted); font-size: 11px; margin: 0 0 14px; }
    .legend span::before {
      content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px;
      border-radius: 2px; vertical-align: -1px; background: var(--line);
    }
    .legend .hot::before { background: var(--warn); }
    .legend .fab::before { background: var(--fab); }
    .legend .chain::before { background: var(--eth); }
    .flows { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip {
      background: var(--bg-3); border: 1px solid var(--line); border-radius: 999px;
      padding: 5px 10px; cursor: pointer; color: var(--muted);
    }
    .chip.on { color: var(--text); border-color: var(--accent); }
    .stepper { display: flex; align-items: center; gap: 8px; margin: 10px 0 14px; }
    .stepper button {
      background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer;
    }
    .seq { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .seq .s {
      flex: 0 0 auto; background: var(--bg-3); border: 1px solid var(--line); border-radius: 4px;
      padding: 6px 8px; min-width: 92px; cursor: pointer; color: var(--muted);
    }
    .seq .s.on { border-color: var(--ok); color: var(--text); }
    .seq .s .i { font-size: 10px; color: var(--muted); }
    h2 { font-size: 15px; margin: 0 0 8px; }
    h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .kv { width: 100%; border-collapse: collapse; }
    .kv td { padding: 5px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
    .kv td:first-child { color: var(--muted); width: 38%; padding-right: 8px; }
    pre, code { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 11.5px; }
    pre {
      background: #0c0f13; border: 1px solid var(--line); border-radius: 6px;
      padding: 10px; overflow: auto; color: #d5dce6; white-space: pre-wrap;
    }
    .note { color: var(--muted); }
    .pill { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--muted); font-size: 11px; }
    .tree { white-space: pre; font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.55; }
    .tree b { color: var(--accent); font-weight: 650; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 1100px) {
      .stage { grid-template-columns: 1fr; }
      .side { border-left: 0; border-top: 1px solid var(--line); }
      .grid-2 { grid-template-columns: 1fr; }
    }
    .callout { border: 1px solid var(--line); background: var(--bg-3); border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>go-ex · торговая площадка ЦФА / HyperCore-модель</h1>
        <p>Быстрый путь (матчинг) — Go in-memory. Юридически значимый стейт — Hyperledger Fabric. Деньги — USDT на Ethereum DepositoryVault. Кликни сервис или пройди флоу по шагам.</p>
      </div>
      <div class="note">клавиши: 1–6 вкладки · ← → шаг флоу</div>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <div class="stage" id="stage">
      <div class="main" id="main"></div>
      <aside class="side" id="side"></aside>
    </div>

<script>

  pg: { name: "Postgres", kind: "data", layer: "Системы записи", k: "проекция + FSM", summary: "Аккаунты, ключи, курсоры индексера, FSM выводов, query API. Primary + sync replica." },
  fabric: { name: "Hyperledger Fabric", kind: "fabric", layer: "Системы записи", k: "valid state", summary: "Канон балансов и прав ЦФА. Channel trading. Orgs: Exchange, Auditor, Regulator. Не матчит ордера." },
  vault: { name: "DepositoryVault", kind: "chain", layer: "Системы записи", k: "ERC-20 USDT", summary: "Ethereum-контракт депозитария. Deposit = transferIn. Withdraw только от signer (HSM)." },
  eth: { name: "Ethereum", kind: "chain", layer: "Системы записи", k: "public L1", summary: "Рельс денег. Reorg-aware. Для крупных сумм — ждать finalized, не только N блоков." },
  hsm: { name: "HSM / Signer", kind: "chain", layer: "Системы записи", k: "withdraw key", summary: "Подпись withdraw(). Ключ не на диске сервиса. Policy: whitelist, daily cap, dual control." },
  obs: { name: "Observability", kind: "data", layer: "Наблюдаемость", k: "OTel", summary: "Логи Loki, метрики Prometheus/Grafana, ошибки Sentry, профили pprof, трейсы OTel." }

];

function nodeCard(id) {
  const n = NODES[id];
  const flow = FLOWS[flowId];
  const active = tab === "flow" ? (flow.steps[step].nodes || []) : [];
  const hl = tab === "flow" && active.includes(id);
  const dim = tab === "flow" && active.length && !active.includes(id);
  const on = tab !== "flow" && selected === id;
  return `<div class="node ${on?"on":""} ${hl?"hl":""} ${dim?"dim":""}" data-node="${id}" data-kind="${n.kind}">
    <div class="k">${n.k}</div><div class="n">${n.name}</div>
  </div>`;
}

function diagram() {
  return `<div class="legend">

    <span class="fab">Fabric valid state</span>
    <span class="chain">Ethereum / custody</span>
  </div>` + LAYERS.map(layer => {
    const ids = Object.keys(NODES).filter(id => NODES[id].layer === layer);
    return `<div class="layer"><h3>${layer}</h3><div class="nodes">${ids.map(nodeCard).join("")}</div></div>`;

}

      <li>Депозиты: UNIQUE(tx_hash, log_index).</li>
      <li>Если local_seq &lt; fabric_seq — не стартовать автоматически.</li>
    </ol>
    <div class="callout"><b>RTO ориентиры (учебный prod-профиль)</b>
      <div class="note">GW/MD: секунды. Matching leader: десятки секунд (replay WAL). Indexer: сразу, лаг = время простоя. Fabric quorum: минуты. HSM: пока не поднят — выводы стоят.</div>
    </div>`;
}

function renderRepo() {
  el("stage").className = "stage wide";
  el("main").innerHTML = `<h2>Монорепо</h2>
    <p class="note">Один репозиторий, отдельные deployable binaries. Chaincode и Solidity — не в runtime-образах matching.</p>
    <div class="tree">${REPO.replace(/[A-Za-z0-9_./|{}\[\]()+,-]+/g, (m) => {
      if (["go-ex/", "proto/", "services/", "chaincode/", "pkg/", "web/", "deploy/", "tests/", "contracts/"].some(p => m.startsWith(p) && m.endsWith("/"))) {
        return `<b>${m}</b>`;
      }
      return m;
    })}</div>
    <h4>Границы пакетов</h4>
    <table class="kv">
      <tr><td>services/*</td><td>только composition root, без чужого домена</td></tr>
      <tr><td>pkg/orderbook</td><td>чистая память, без Kafka/PG — легко тестировать</td></tr>
      <tr><td>pkg/wal</td><td>append-only, CRC, snapshot hash</td></tr>
      <tr><td>proto/</td><td>единственный контракт между сервисами</td></tr>
      <tr><td>web/</td><td>только публичное REST/WS</td></tr>
    </table>`;
  el("side").innerHTML = "";
}

function renderObs() {
  el("stage").className = "stage";
  el("main").innerHTML = `<h2>Логи, метрики, инциденты</h2>
    <div class="callout"><b>Стек</b><div>OpenTelemetry SDK в каждом Go-сервисе → Prometheus + Loki + Tempo/Jaeger. Grafana дашборды. Sentry — ошибки. pprof — CPU/heap matching и gw.</div></div>
    <h4>Красные метрики</h4>
    <p>${OBS.metrics.map(m => `<code class="pill">${m}</code>`).join(" ")}</p>
    <h4>Логи (Loki)</h4><p class="note">${OBS.logs}</p>
    <h4>Sentry</h4><p class="note">${OBS.sentry}</p>
    <h4>Grafana SLO</h4><p class="note">${OBS.grafana}</p>
    <h4>pprof</h4><p class="note">${OBS.pprof}</p>
    <h4>Тесты (перспектива)</h4><p class="note">${OBS.tests}</p>`;
  el("side").innerHTML = `<h2>Алерты Sev-1</h2>
    <ul>
      <li>Два лидера matching (не должно)</li>
      <li>WAL CRC / отказ fsync</li>
      <li>Fabric lag &gt; SLA</li>
      <li>Withdraw stuck in signed &gt; N min</li>
      <li>Double credit попытка (unique violation) — исследовать, не глотать</li>
      <li>local_seq &lt; fabric_seq</li>
    </ul>
    <div class="callout"><b>Доступность</b>
      <div class="note">GW/Auth/MD: HPA, 2+ AZ. Matching: active-passive на AZ. Kafka RF3. PG sync replica. Fabric: 2+ peers/org, orderer raft. Eth: 2 провайдера RPC.</div>
    </div>`;
}

function render() {
  renderTabs();
  if (tab === "arch") renderArch();
  if (tab === "flow") renderFlow();
  if (tab === "data") renderData();
  if (tab === "fail") renderFail();
  if (tab === "repo") renderRepo();
  if (tab === "obs") renderObs();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-node],[data-flow],[data-step],[data-act],[data-goflow]");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  if (t.dataset.node) { selected = t.dataset.node; if (tab === "arch") render(); if (tab === "flow") { /* keep */ } }
  if (t.dataset.flow) { flowId = t.dataset.flow; step = 0; render(); }
  if (t.dataset.goflow) { tab = "flow"; flowId = t.dataset.goflow; step = 0; render(); }
  if (t.dataset.step) { step = +t.dataset.step; render(); }
  if (t.dataset.act === "prev") { step = Math.max(0, step - 1); render(); }
  if (t.dataset.act === "next") { step = Math.min(FLOWS[flowId].steps.length - 1, step + 1); render(); }
});

document.addEventListener("keydown", (e) => {
  const n = +e.key;
  if (n >= 1 && n <= 6) { tab = TABS[n-1].id; render(); }
  if (tab !== "flow") return;
  if (e.key === "ArrowRight") { step = Math.min(FLOWS[flowId].steps.length - 1, step + 1); render(); }
  if (e.key === "ArrowLeft") { step = Math.max(0, step - 1); render(); }
});

render();
</script>
</body>
